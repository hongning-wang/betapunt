[project]
name = "beta-punters"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "cython>=3.2.3",
    "distrax>=0.1.3",
    "flax>=0.7.2",
    "jax>=0.4.13",
    "pkrbot>=1.1.0",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"